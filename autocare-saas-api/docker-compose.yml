services:
  postgres:
    image: postgres:16-alpine
    container_name: autocare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autocare
      POSTGRES_USER: autocare
      POSTGRES_PASSWORD: autocare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocare -d autocare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
